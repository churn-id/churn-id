name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    # Anyone who can push can start a workflow; only the owner releases.
    if: github.ref == 'refs/heads/main' && github.triggering_actor == github.repository_owner
    uses: ./.github/workflows/build.yml
    # Without it, the sign job reads the release environment's secrets as empty.
    secrets: inherit

  draft:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: churn-release-apk
          path: apk

      # Any job of the run can replace the run's artifacts, so the draft takes
      # only the APK that the sign job signed.
      - name: Check that the APK is the sign job's
        env:
          APK_SHA256: ${{ needs.build.outputs.apk-sha256 }}
        run: echo "$APK_SHA256  apk/app-release.apk" | sha256sum --strict -c

      # The notes begin with the SHA-256 that About shows, of the APK's files
      # apart from META-INF, as the Coverage build job (build.yml) hashes the
      # coverage build, so that users can check their install against it.
      - name: Draft a release with the signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/aapt2
          version=$("$aapt2" dump badging apk/app-release.apk | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")
          if [ -z "$version" ]; then
            echo "::error::The APK names no versionName."
            exit 1
          fi
          mv apk/app-release.apk "apk/churn-$version.apk"
          dir=$(mktemp -d)
          unzip -q -d "$dir" "apk/churn-$version.apk" -x 'META-INF/*'
          sha256=$( (cd "$dir" && find . -type f | LC_ALL=C sort | xargs -d '\n' sha256sum) | sha256sum)
          sha256=$(echo "${sha256%% *}" | sed 's/.\{8\}/& /g; s/ $//')
          # The tag comes into being when the draft is published.
          gh release create "v$version" --draft --target "$GITHUB_SHA" --title "Churn $version" \
            --notes "About, in Churn's menu, shows the SHA-256 of the files in its APK apart from META-INF. For this release, it is \`$sha256\`." \
            --generate-notes "apk/churn-$version.apk"
