name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The Release workflow runs this one first.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: streetsidesoftware/cspell-action@ce1816e4ce36532956ac6e983737392774b6e169 # v9.2.0
        with:
          files: |
            **/*.md
            android/app/src/**
            fastlane/**
          incremental_files_only: false

      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        if: ${{ !cancelled() }}
        with:
          globs: '**/*.md'

      - name: Lint the shell scripts
        if: ${{ !cancelled() }}
        run: shellcheck -S warning android/app/src/main/assets/restore.sh android/app/src/test/sh/*.sh

  bundle:
    name: Release bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Test and build release bundle and APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon test bundleRelease assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Report Gradle failure
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/gradle.log" ] || exit 0
          reason=$(sed -n '/^\* What went wrong:/,/^\* Try:/p' "$RUNNER_TEMP/gradle.log" \
            | sed '1d;$d' | head -c 3000)
          [ -n "$reason" ] || exit 0
          reason=${reason//'%'/'%25'}
          reason=${reason//$'\r'/'%0D'}
          reason=${reason//$'\n'/'%0A'}
          echo "::error title=Gradle build failed::$reason"

      # RouterScriptsTest wrote the scripts that Router sends, as it sends them.
      - name: Check the router scripts
        run: |
          shellcheck -s sh -S warning app/build/router-scripts/*.sh
          for rules in app/build/router-scripts/*.nft; do sudo nft -c -f "$rules"; done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: router-scripts
          path: android/app/build/router-scripts/
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: churn-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: churn-release-apk-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  router-scripts:
    name: Router scripts
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: router-scripts
          path: router-scripts

      - name: Run restore.sh and the overwrite under BusyBox
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q busybox-static
          sudo sh android/app/src/test/sh/router-scripts-test.sh router-scripts

  rebuild:
    name: Reproducible APK
    needs: bundle
    runs-on: ubuntu-latest
    # Like F-Droid's build: from a checkout in a folder of its own, and
    # without setup-gradle, so without Gradle's caches.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rebuild

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: churn-release-apk-unsigned
          path: first

      - name: Build the release APK again and compare
        working-directory: rebuild/android
        run: |
          ./gradlew --no-daemon assembleRelease
          first=$GITHUB_WORKSPACE/first/app-release-unsigned.apk
          again=app/build/outputs/apk/release/app-release-unsigned.apk
          if ! cmp -s "$first" "$again"; then
            echo "::error::The APK built again differs from the Release bundle job's."
            diff <(unzip -lv "$first") <(unzip -lv "$again") || true
            exit 1
          fi

  sign:
    name: Sign release bundle and APK
    needs: [bundle, router-scripts, rebuild]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Signing secrets live in the "release" environment, which only main may
    # use. No Gradle and no code from the repository run in this job, so no
    # build plugin, dependency or test can read the upload key.
    environment: release
    steps:
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: churn-release-aab-unsigned
          path: bundle

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: churn-release-apk-unsigned
          path: apk

      - name: Sign the bundle and APK with the upload key
        env:
          KEYSTORE_B64: ${{ secrets.CHURN_UPLOAD_KEYSTORE_B64 }}
          CHURN_KEYSTORE_PASSWORD: ${{ secrets.CHURN_UPLOAD_PASSWORD }}
          CHURN_KEY_ALIAS: upload
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::The release environment has no CHURN_UPLOAD_KEYSTORE_B64."
            exit 1
          fi
          # Pasted secrets often pick up line breaks or spaces; base64 has neither.
          if ! printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/upload.jks"; then
            echo "::error::CHURN_UPLOAD_KEYSTORE_B64 is not valid base64."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" \
              -storepass:env CHURN_KEYSTORE_PASSWORD >/dev/null 2>&1; then
            echo "::error::Cannot open the upload keystore: the file is damaged or CHURN_UPLOAD_PASSWORD is wrong."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" \
              -storepass:env CHURN_KEYSTORE_PASSWORD -alias "$CHURN_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The upload keystore has no key with the alias '$CHURN_KEY_ALIAS'."
            exit 1
          fi
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass:env CHURN_KEYSTORE_PASSWORD \
            bundle/app-release.aab "$CHURN_KEY_ALIAS"
          # APKs take apksigner, from the newest build tools of the runner's Android SDK.
          # It keeps AGP's alignment, so that F-Droid can copy our signature onto its build.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner
          "$apksigner" sign --ks "$RUNNER_TEMP/upload.jks" --ks-pass env:CHURN_KEYSTORE_PASSWORD \
            --ks-key-alias "$CHURN_KEY_ALIAS" --alignment-preserved true \
            --out apk/app-release.apk apk/app-release-unsigned.apk
          "$apksigner" verify apk/app-release.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: churn-release-aab
          path: bundle/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: churn-release-apk
          path: apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
