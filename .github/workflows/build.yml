name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: streetsidesoftware/cspell-action@ce1816e4ce36532956ac6e983737392774b6e169 # v9.2.0
        with:
          files: |
            **/*.md
            android/app/src/**
          incremental_files_only: false

      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        if: ${{ !cancelled() }}
        with:
          globs: '**/*.md'

  bundle:
    name: Release bundle
    runs-on: ubuntu-latest
    # Signing secrets live in the "release" environment, which only main may
    # use. Builds of any other ref get no environment and stay unsigned.
    environment: ${{ github.ref == 'refs/heads/main' && 'release' || '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Test and build release bundle
        env:
          KEYSTORE_B64: ${{ secrets.CHURN_UPLOAD_KEYSTORE_B64 }}
          CHURN_KEYSTORE_PASSWORD: ${{ secrets.CHURN_UPLOAD_PASSWORD }}
          CHURN_KEY_ALIAS: upload
          CHURN_KEY_PASSWORD: ${{ secrets.CHURN_UPLOAD_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            # Pasted secrets often pick up line breaks or spaces; base64 has neither.
            if ! printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/upload.jks"; then
              echo "::error::CHURN_UPLOAD_KEYSTORE_B64 is not valid base64."
              exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" \
                -storepass "$CHURN_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              echo "::error::Cannot open the upload keystore: the file is damaged or CHURN_UPLOAD_PASSWORD is wrong."
              exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" \
                -storepass "$CHURN_KEYSTORE_PASSWORD" -alias "$CHURN_KEY_ALIAS" >/dev/null 2>&1; then
              echo "::error::The upload keystore has no key with the alias '$CHURN_KEY_ALIAS'."
              exit 1
            fi
            export CHURN_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          else
            echo "::warning::No upload keystore configured; the bundle is unsigned and Play will reject it."
          fi
          ./gradlew --no-daemon test bundleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Report Gradle failure
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/gradle.log" ] || exit 0
          reason=$(sed -n '/^\* What went wrong:/,/^\* Try:/p' "$RUNNER_TEMP/gradle.log" \
            | sed '1d;$d' | head -c 3000)
          [ -n "$reason" ] || exit 0
          reason=${reason//'%'/'%25'}
          reason=${reason//$'\r'/'%0D'}
          reason=${reason//$'\n'/'%0A'}
          echo "::error title=Gradle build failed::$reason"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: churn-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
