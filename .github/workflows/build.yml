name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The Release workflow runs this one first.
  workflow_call:
    outputs:
      apk-sha256:
        value: ${{ jobs.sign.outputs.apk-sha256 }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: streetsidesoftware/cspell-action@ce1816e4ce36532956ac6e983737392774b6e169 # v9.2.0
        with:
          files: |
            **/*.md
            android/app/src/**
            fastlane/**
            website/**
          incremental_files_only: false

      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        if: ${{ !cancelled() }}
        with:
          globs: '**/*.md'

      - name: Lint the shell scripts
        if: ${{ !cancelled() }}
        run: shellcheck -S warning android/app/src/main/assets/restore.sh android/app/src/test/sh/*.sh

      - name: Check that the website matches the store listing and the icon
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check-website.py

  bundle:
    name: Release bundle
    runs-on: ubuntu-latest
    outputs:
      aab-sha256: ${{ steps.sha256.outputs.aab }}
      apk-sha256: ${{ steps.sha256.outputs.apk }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Test and build release bundle and APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon test bundleRelease assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Report Gradle failure
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/gradle.log" ] || exit 0
          reason=$(sed -n '/^\* What went wrong:/,/^\* Try:/p' "$RUNNER_TEMP/gradle.log" \
            | sed '1d;$d' | head -c 3000)
          [ -n "$reason" ] || exit 0
          reason=${reason//'%'/'%25'}
          reason=${reason//$'\r'/'%0D'}
          reason=${reason//$'\n'/'%0A'}
          echo "::error title=Gradle build failed::$reason"

      # RouterScriptsTest wrote the scripts that Router sends, as it sends them.
      - name: Check the router scripts
        run: |
          shellcheck -s sh -S warning app/build/router-scripts/*.sh
          for rules in app/build/router-scripts/*.nft; do sudo nft -c -f "$rules"; done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: router-scripts
          path: android/app/build/router-scripts/
          if-no-files-found: error
          retention-days: 1

      # For the sign job, which signs only these files.
      - name: Record the SHA-256 of the bundle and APK
        id: sha256
        working-directory: android/app/build/outputs
        run: |
          echo "aab=$(sha256sum < bundle/release/app-release.aab | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "apk=$(sha256sum < apk/release/app-release-unsigned.apk | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: churn-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: churn-release-apk-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  router-scripts:
    name: Router scripts
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: router-scripts
          path: router-scripts

      - name: Run restore.sh and the overwrite under BusyBox
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q busybox-static
          sudo sh android/app/src/test/sh/router-scripts-test.sh router-scripts

  rebuild:
    name: Reproducible APK
    needs: bundle
    runs-on: ubuntu-latest
    # Like F-Droid's build: from a checkout in a folder of its own, and
    # without setup-gradle, so without Gradle's caches.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rebuild

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: churn-release-apk-unsigned
          path: first

      - name: Build the release APK again and compare
        working-directory: rebuild/android
        run: |
          ./gradlew --no-daemon assembleRelease
          first=$GITHUB_WORKSPACE/first/app-release-unsigned.apk
          again=app/build/outputs/apk/release/app-release-unsigned.apk
          if ! cmp -s "$first" "$again"; then
            echo "::error::The APK built again differs from the Release bundle job's."
            diff <(unzip -lv "$first") <(unzip -lv "$again") || true
            exit 1
          fi

  coverage:
    name: Coverage build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # A run's coverage files come from a phone, so the counts of one unit
      # test class stand in for them, in a line of Base64 as Share coverage
      # writes them. The report with all unit tests then has to reach more.
      - name: Build the coverage build, and its reports from the unit tests
        run: |
          ./gradlew --no-daemon assembleDebug testDebugUnitTest --tests id.churn.CoverageTest -Pcoverage
          mkdir "$RUNNER_TEMP/coverage"
          base64 -w 0 "$(find app/build -name testDebugUnitTest.exec)" > "$RUNNER_TEMP/coverage/churn-coverage-00000000.txt"
          ./gradlew --no-daemon coverageReport coverageReportWithUnitTests -Pcoverage="$RUNNER_TEMP/coverage"

      - name: Check the counters in the APK, and the reports
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$apk" jacoco-agent.properties | grep -x output=none
          unzip -p "$apk" 'classes*.dex' | grep -a -q -F 'Lorg/jacoco/agent/rt/RT;'
          unzip -p "$apk" 'classes*.dex' | grep -a -q -F '$jacocoInit'
          python3 - app/build/reports/jacoco <<'EOF'
          import sys
          import xml.etree.ElementTree as ElementTree


          def lines(report):
              root = ElementTree.parse(f'{sys.argv[1]}/{report}/{report}.xml').getroot()
              counter = next(c for c in root.findall('counter') if c.get('type') == 'LINE')
              covered = int(counter.get('covered'))
              return covered, covered + int(counter.get('missed'))


          run, total = lines('coverageReport')
          both, _ = lines('coverageReportWithUnitTests')
          print(f"Of the debug build's {total} lines, CoverageTest reaches {run} and all unit tests {both}.")
          if run == 0:
              sys.exit("The report found none of the run's counts in the debug build's classes.")
          if both <= run:
              sys.exit("The report with the unit tests reaches no more than the run's counts.")
          EOF

  sign:
    name: Sign release bundle and APK
    needs: [bundle, router-scripts, rebuild]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Signing secrets live in the "release" environment, which only main may
    # use. No Gradle and no code from the repository run in this job, so no
    # build plugin, dependency or test can read the upload key. The decoded
    # keystore exists only while the signing step runs, so the steps after it
    # can't read the file either.
    environment: release
    outputs:
      apk-sha256: ${{ steps.sign.outputs.apk-sha256 }}
    steps:
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: churn-release-aab-unsigned
          path: bundle

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: churn-release-apk-unsigned
          path: apk

      # Any job of the run can replace the run's artifacts, so this job signs
      # only what the Release bundle job built.
      - name: Check that the bundle and APK are the Release bundle job's
        env:
          AAB_SHA256: ${{ needs.bundle.outputs.aab-sha256 }}
          APK_SHA256: ${{ needs.bundle.outputs.apk-sha256 }}
        run: |
          sha256sum --strict -c <<EOF
          $AAB_SHA256  bundle/app-release.aab
          $APK_SHA256  apk/app-release-unsigned.apk
          EOF

      - name: Sign the bundle and APK with the upload key
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.CHURN_UPLOAD_KEYSTORE_B64 }}
          CHURN_KEYSTORE_PASSWORD: ${{ secrets.CHURN_UPLOAD_PASSWORD }}
          CHURN_KEY_ALIAS: upload
        run: |
          trap 'rm -f "$RUNNER_TEMP/upload.jks"' EXIT
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::The release environment has no CHURN_UPLOAD_KEYSTORE_B64."
            exit 1
          fi
          # Pasted secrets often pick up line breaks or spaces; base64 has neither.
          if ! printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/upload.jks"; then
            echo "::error::CHURN_UPLOAD_KEYSTORE_B64 is not valid base64."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" \
              -storepass:env CHURN_KEYSTORE_PASSWORD >/dev/null 2>&1; then
            echo "::error::Cannot open the upload keystore: the file is damaged or CHURN_UPLOAD_PASSWORD is wrong."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" \
              -storepass:env CHURN_KEYSTORE_PASSWORD -alias "$CHURN_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The upload keystore has no key with the alias '$CHURN_KEY_ALIAS'."
            exit 1
          fi
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass:env CHURN_KEYSTORE_PASSWORD \
            bundle/app-release.aab "$CHURN_KEY_ALIAS"
          # APKs take apksigner, from the newest build tools of the runner's Android SDK.
          # It keeps AGP's alignment, so that F-Droid can copy our signature onto its build.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner
          "$apksigner" sign --ks "$RUNNER_TEMP/upload.jks" --ks-pass env:CHURN_KEYSTORE_PASSWORD \
            --ks-key-alias "$CHURN_KEY_ALIAS" --alignment-preserved true \
            --out apk/app-release.apk apk/app-release-unsigned.apk
          # F-Droid's metadata for Churn lists our certificate's SHA-256.
          "$apksigner" verify --print-certs apk/app-release.apk > "$RUNNER_TEMP/certs.txt"
          grep 'certificate SHA-256' "$RUNNER_TEMP/certs.txt"
          echo "apk-sha256=$(sha256sum < apk/app-release.apk | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: churn-release-aab
          path: bundle/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: churn-release-apk
          path: apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  fdroid:
    name: F-Droid build
    needs: bundle
    runs-on: ubuntu-latest
    # F-Droid's build server image, set up and run as the "fdroid build" job of
    # fdroiddata's CI does for merge requests, so that this job builds the
    # commit as F-Droid's build server would:
    # https://gitlab.com/fdroid/fdroiddata/-/blob/master/.gitlab-ci.yml
    # Like that job, it takes the image's current version and F-Droid's
    # current tools rather than pinned ones.
    container: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: churn

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: churn-release-apk-unsigned
          path: ours

      - name: Set up F-Droid's tools
        run: |
          . /etc/profile.d/bsenv.sh
          apt-get update
          apt-get dist-upgrade
          sdkmanager "platform-tools" "build-tools;31.0.0"
          rm -rf "$fdroidserver"
          git clone --depth 1 https://gitlab.com/fdroid/fdroidserver.git "$fdroidserver"
          git -C "$home_vagrant/gradlew-fdroid" pull
          apt-get install openjdk-21-jdk-headless
          update-alternatives --set java /usr/lib/jvm/java-21-openjdk-amd64/bin/java
          java -version

      - name: Build the release APK with F-Droid's tools
        run: |
          . /etc/profile.d/bsenv.sh
          # F-Droid clones the repository. Here it clones a clone of this
          # checkout, which has the commit on a branch.
          git -C churn branch fdroid
          git clone --quiet --branch fdroid churn "$home_vagrant/churn"
          apk_id=$(PYTHONPATH=$fdroidserver python3 -c \
            'import sys; from fdroidserver import common; print(*common.get_apk_id(sys.argv[1]))' \
            ours/app-release-unsigned.apk)
          read -r _ version_code version_name <<< "$apk_id"
          # The build of our recipe in F-Droid's repository, for this commit.
          mkdir -p "$home_vagrant/metadata"
          cat > "$home_vagrant/metadata/id.churn.yml" <<EOF
          RepoType: git
          Repo: $home_vagrant/churn
          Builds:
            - versionName: '$version_name'
              versionCode: $version_code
              commit: '$(git -C churn rev-parse HEAD)'
              subdir: android/app
              gradle:
                - yes
          EOF
          mkdir -p "$home_vagrant"/{logs,tmp,unsigned,.android,.gradle}
          chown -R vagrant "$home_vagrant"
          cd "$home_vagrant"
          sudo --preserve-env --user vagrant env -u CI \
            PATH="$fdroidserver:$PATH" PYTHONPATH="$fdroidserver:$fdroidserver/examples" \
            PYTHONUNBUFFERED=true HOME="$home_vagrant" GRADLE_USER_HOME="$home_vagrant/.gradle" \
            fdroid build --verbose --test --refresh-scanner --on-server --no-tarball "id.churn:$version_code"
          mkdir "$GITHUB_WORKSPACE/fdroid"
          cp "tmp/id.churn_$version_code.apk" "$GITHUB_WORKSPACE/fdroid/"

      - name: Compare with the Release bundle job's APK
        run: |
          ours=ours/app-release-unsigned.apk
          fdroid=$(ls fdroid/*.apk)
          if ! cmp -s "$ours" "$fdroid"; then
            echo "::error::F-Droid's build differs from the Release bundle job's APK."
            diff <(unzip -lv "$ours") <(unzip -lv "$fdroid") || true
            exit 1
          fi

      # For the signature job, and to look into a difference.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: churn-fdroid-apk-unsigned
          path: fdroid/*.apk
          if-no-files-found: ignore
          retention-days: 14

  fdroid-signature:
    name: Our signature on F-Droid's build
    # Only main has the sign job's APK.
    needs: [fdroid, sign]
    runs-on: ubuntu-latest
    container: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: churn-release-apk
          path: signed

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: churn-fdroid-apk-unsigned
          path: fdroid

      # F-Droid ships our APK only if it has more than a v1 signature and if
      # our signature, copied onto F-Droid's build, verifies there. F-Droid's
      # tools check both with these functions.
      - name: Copy our signature onto F-Droid's build and verify it
        run: |
          . /etc/profile.d/bsenv.sh
          rm -rf "$fdroidserver"
          git clone --depth 1 https://gitlab.com/fdroid/fdroidserver.git "$fdroidserver"
          PYTHONPATH=$fdroidserver python3 - signed/app-release.apk fdroid/*.apk <<'EOF'
          import sys
          import tempfile

          from fdroidserver import common

          common.get_config()
          signed, built = sys.argv[1:]
          if common.apkfile_is_v1_signed_only(signed):
              print("::error::Our APK has only a v1 signature, which F-Droid refuses.")
              sys.exit(1)
          with tempfile.TemporaryDirectory() as tmp:
              error = common.verify_apks(signed, built, tmp)
          if error:
              print("::error::Our signature doesn't verify on F-Droid's build.")
              print(error)
              sys.exit(1)
          print("Our signature verifies on F-Droid's build.")
          EOF
